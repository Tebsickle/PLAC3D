services:
  plac3d:
    build: .
    env_file:
      - .env
    ports:
      - "${APP_PORT:-5173}:${PORT:-8787}"
      - "${PORT:-8787}:${PORT:-8787}"
    environment:
      PORT: ${PORT:-8787}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      DATABASE_PATH: ${DOCKER_DATABASE_PATH:-/app/data/plac3d.db}
    volumes:
      - ./data:/app/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    extra_hosts:
      - "host.docker.internal:host-gateway"
